plugins {
    id 'java'
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group 'com.chainedminds'
version '1.3.8'

repositories {
    mavenCentral()
}

dependencies {
    api('com.fasterxml.jackson.core:jackson-databind:2.22.2')
    api('com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.22.2')
    api('com.squareup.okhttp3:okhttp:5.5.0')
    api('io.netty:netty-all:4.2.17.Final')
    api('net.lingala.zip4j:zip4j:2.11.6')
    implementation('com.mysql:mysql-connector-j:26.7.0')
    implementation('org.brotli:dec:0.1.2')
}